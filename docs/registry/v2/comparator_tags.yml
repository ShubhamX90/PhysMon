    value: 0.6464
    target: sensitivity label (S_lp >= 0.5)
    tag: deployable
    access: "TF-IDF of the model's generated answer text"
    reason: "Generated text only."
  - id: cot_text_classifier_qwen
    names_in_record: ["CoT-text classifier"]
    stage: "Stage 9"
    artifact: results/stage9/baselines/cot_text/surface_cot_text_classifier_slp_binary.json
    field: results_by_model.qwen.auroc
    value: 0.599
    target: sensitivity label (S_lp >= 0.5)
    tag: deployable
    access: "TF-IDF of generated text"
    reason: "Generated text only."
  - id: llm_judge_zero_shot
    names_in_record: ["LLM judge (DeepSeek, Llama settings A and B)"]
    stage: "Stage 9"
    artifact: results/stage9/baselines/llm_judge/judge_ensemble_summary.json
    field: zero_shot_auroc_mean
    value: 0.4797
    target: sensitivity label (S_lp >= 0.5)
    tag: oracle
    access: "judge model reads the prompt(s) and the certified answer"
    reason: "scripts/run_llm_judge_baseline.py puts 'The correct answer ... is: {correct_answer}' into both judge prompts, so the judge needs y*. (Its loo_probe_auroc of 1.0 for llama_setting_b is a fitted value on a constant judge output and is not a comparator.)"
  - id: self_consistency
    names_in_record: ["self-consistency"]
    stage: "Stage 9"
    artifact: results/stage9/stage9_final_summary.json
    field: baselines.self_consistency_auroc
    value: 0.5369
    target: sensitivity label (S_lp >= 0.5)
    tag: deployable
    access: "several sampled generations per rendering (modal-answer consistency and cross-rendering diversity)"
    reason: "scripts/run_self_consistency_baseline.py uses parsed sampled answers only; no y*."
  - id: hidden_state_monitor
