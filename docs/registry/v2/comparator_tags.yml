    field: model_metrics.hidden_state_monitor.auroc
    value: 0.7596
    target: sensitivity label (S_lp >= 0.5)
    role: subject
    tag: deployable
    access: "hidden states over the four renderings (mean-state variance probe, layer 18)"
    reason: "The monitor itself, listed so every comparison names both sides' access."
  - id: wave2_combined_non_activation
    names_in_record: ["combined non-activation baseline", "strongest non-activation combination (decision log, Wave 2)"]
    stage: "Wave 2 (2026-08-27, job 332409)"
    artifact: results/wave2/combined_baseline/combined_baseline_summary.json
