    value: 0.7048
    target: sensitivity label (S_lp >= 0.5)
    tag: oracle
    access: "log p(y*) on four renderings; the certified answer's magnitude; template surface statistics"
    reason: "scripts/run_combined_baseline.py takes entropy_proxy and mean_logprob_correct from the entropy_fitted_logprob features (logprob_correct_answer) and answer_log10_magnitude from the certified answer. It is not evidence available at deployment; see results/wave2/ORACLE_COMPARATOR_NOTE.md."
