# Oracle / deployable tags for every comparator used in Phase I (Stages 9-10) and Wave 2.
#
# G0 item (d) of the plan of record (docs/proposals/PhysMon_Research_v2.tex, "G0. Integrity
# closure"; docs/reviews/iclr2027_submission50608/analysis.md section 5 point 2(d); review check C4).
# Written 2026-11-12, Stage 15.0 (journal J15.0-004). Existing result files are not modified; this
# file is the tag record, and tests/v2/test_comparator_tags_g0.py checks every value against its
# source.
#
# tag:
#   oracle      - computing the score at inference needs the certified answer y* (its string, value
#                 or the model's log-probability of it), i.e. the inputs the sensitivity label is
#                 built from. Such a comparator is never called "non-activation", "one forward pass"
#                 or "deployable", and never reported as a monitor baseline without this tag.
#   deployable  - computable at inference without y*. `access` says what it needs instead
#                 (prompt text, generated text, sampled generations, output distribution over
#                 several renderings, hidden states). Training on labels is allowed for either tag.
# role: comparator (default) | subject (the monitor being compared) | diagnostic (known-leaky)
# target: the label the stated AUROC is computed against.
#
# Values: AUROC as stored in `artifact` at `field` (rounded to 4 places). Nothing here is
# paper-eligible; all are discovery-tier values on the 135-family panel selected in earlier stages.

schema_version: 1
date: "2026-11-12"
journal_ref: J15.0-004
comparators:
  - id: entropy_fitted_logprob
    names_in_record: ["entropy proxy", "fitted entropy baseline", "fitted token-entropy (paper)", "entropy_fitted_baseline (Wave 2)"]
    stage: "Stage 9; reused in Wave 2"
    artifact: results/stage9/baselines/entropy/entropy_baseline_summary.json
    field: auroc
    value: 0.727
    target: sensitivity label (S_lp >= 0.5)
    tag: oracle
    access: "log p(y*) on all four renderings"
    reason: "scripts/run_entropy_baseline.py builds its two features from logprob_correct_answer (std and mean across the 4 renderings), the quantity S_lp is computed from (review check C4)."
  - id: token_entropy_std
    names_in_record: ["oracle-free token entropy"]
    stage: "Stage 10"
    artifact: results/stage10/baselines/token_entropy/token_entropy_summary.json
    field: auroc
    value: 0.5204
    target: sensitivity label (S_lp >= 0.5)
    tag: deployable
    access: "top-1000 next-token entropy on each of the four renderings (four forward passes, no y*)"
    reason: "Feature token_entropy_topk_1000_std_across_4_variants uses the output distribution only; this is the oracle-free entropy baseline of review check C4."
  - id: token_entropy_mean
    names_in_record: ["mean token entropy"]
    stage: "Stage 10"
    artifact: results/stage10/baselines/token_entropy/token_entropy_summary.json
    field: mean_entropy_auroc
    value: 0.4156
    target: sensitivity label (S_lp >= 0.5)
    tag: deployable
    access: "next-token entropy on the four renderings"
    reason: "Output distribution only. The stored mean_entropy_flipped_auroc (0.5844) reverses the sign after seeing the labels and is not a pre-specified comparator."
  - id: correctness_probe
    names_in_record: ["correctness probe", "generic correctness probe (C04)"]
    stage: "Stage 9"
    artifact: results/stage9/baselines/correctness_probe/summary_variance.json
    field: best_auroc
    value: 0.7657
    target: "answer correctness (its own target), NOT the sensitivity label; scored against the sensitivity label it gives 0.380 (review check C5b)"
    tag: deployable
    access: "hidden states (layer 24, residual stream at the last prompt token); activation-based, so excluded from any non-activation comparator (Wave 2 decision, 2026-08-27)"
    reason: "Inference reads activations only; y* is used for training labels. The 0.7657 is not a sensitivity-prediction value and must not be quoted beside the monitor as if it were."
  - id: blackbox_counterfactual_margin
    names_in_record: ["black-box two-query check (C06)"]
    stage: "Stage 9"
    artifact: results/stage9/baselines/blackbox_counterfactual/blackbox_counterfactual_summary.json
    field: family_level_auroc_margin
    value: 0.6684
    target: sensitivity label (S_lp >= 0.5)
    tag: deployable
    access: "prompt-surface differences between renderings (cue value, length, numeric-token count, TF-IDF distance)"
    reason: "Inference features are prompt-only; the pairwise training target uses gold log-probabilities, which is supervision, not an inference input."
  - id: blackbox_counterfactual_directional
    names_in_record: ["black-box directional score"]
    stage: "Stage 9"
    artifact: results/stage9/baselines/blackbox_counterfactual/blackbox_counterfactual_summary.json
    field: family_level_auroc_directional
    value: 0.438
    target: sensitivity label (S_lp >= 0.5)
    tag: deployable
    access: "as blackbox_counterfactual_margin"
    reason: "Same features; directional family score."
  - id: answer_rationale_classifier_qwen
    names_in_record: ["answer-rationale classifier"]
    stage: "Stage 9"
    artifact: results/stage9/baselines/answer_rationale/surface_answer_rationale_classifier_slp_binary.json
