name: physmon
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch>=2.2
  - pytorch-cuda=12.1
  - transformers>=4.40
  - accelerate>=0.27
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.13
  - scikit-learn>=1.4
  - sympy>=1.12
  - matplotlib>=3.8
  - seaborn>=0.13
  - pyyaml>=6.0
  - jsonlines>=4.0
  - tqdm>=4.66
  - rich>=13.0
  - pytest>=8.0
  - pip
  - pip:
      - transformer-lens>=1.15
      - baukit @ git+https://github.com/davidbau/baukit.git
      - wandb>=0.17
      - ruff>=0.4
      - einops>=0.7
      - -e .
